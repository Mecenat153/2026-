name: Update Election Data

on:
workflow_dispatch:
schedule:
- cron: '*/1 * * * *'

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Fetch election data
    run: |
      mkdir -p data
      curl -L "https://info.nec.go.kr/m/electioninfo/electionInfo_report.json" -o data/data.json

  - name: Commit changes
    run: |
      git config user.name github-actions
      git config user.email github-actions@github.com
      git add data/data.json
      git diff --staged --quiet || git commit -m "update election data"

  - name: Push
    run: git push
```
