name: Update Election Data Excel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Fetch and Process Election Data
        run: |
          mkdir -p data
          # 1. 선관위 실시간 raw 데이터 다운로드
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://info.nec.go.kr/m/electioninfo/electionInfo_report.json" -o data/raw_data.json
          
          # 2. 파이썬으로 안산시장 후보 및 득표율 데이터만 완벽하게 매핑
          python - <<EOF
          import json
          import pandas as pd
          import os

          try:
              with open('data/raw_data.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              rows = []
              
              # 선관위의 표준 JSON 내부 구조(json 데이터 리스트 구조)를 순회합니다.
              # '안산' 혹은 '안산시장' 텍스트를 포함하는 선거 정보 데이터를 자동으로 찾아냅니다.
              def search_ansan(obj):
                  if isinstance(obj, dict):
                      # 텍스트 검사하여 안산 데이터 포착 시 데이터 추출
                      if any('안산' in str(v) for v in obj.values()):
                          # JSON 구조에 존재하는 후보자명, 득표수, 득표율 항목들을 유연하게 추출합니다.
                          # 선관위 json 내부의 대표적인 필드명 매칭 (한글명 혹은 영문코드 매칭)
                          name = obj.get('cnddtName') or obj.get('CANDIDATE_NAME') or obj.get('후보자명')
                          votes = obj.get('toteVtes') or obj.get('VOTES') or obj.get('득표수')
                          rate = obj.get('vtesRate') or obj.get('VOTE_RATE') or obj.get('득표율')
                          
                          if name and (votes or rate):
                              rows.append({
                                  '선거구명': '안산시장 선거',
                                  '후보자명': str(name).strip(),
                                  '득표수 (표)': str(votes).strip() if votes else '집계중',
                                  '득표율 (%)': f"{float(str(rate).replace('%','').strip())}%" if rate else '집계중'
                              })
                      for k, v in obj.items():
                          search_ansan(v)
                  elif isinstance(obj, list):
                      for item in obj:
                          search_ansan(item)

              search_ansan(data)

              # 만약 데이터를 못 찾았을 경우, 다운로드받은 원본 JSON의 핵심 요약이라도 표로 변환
              if not rows:
                  if isinstance(data, dict):
                      # json 내부의 테이블 데이터 성격의 리스트를 찾아 강제 변환 시도
                      for k, v in data.items():
                          if isinstance(v, list) and len(v) > 0 and isinstance(v[0], dict):
                              rows = v[:30] # 상위 30개 데이터 임시 표출
                              break
              
              if rows:
                  df = pd.DataFrame(rows)
              else:
                  # 데이터 구조가 특이할 때 원본 전체 텍스트 확인용 안전 표 생성
                  df = pd.DataFrame([{"알림": "현재 선거 데이터 접수 대기 중이거나 선관위 데이터 구조가 변동되었습니다.", "힌트": "raw_data.json 파일은 정상 수집되었습니다."}])

              # 엑셀 파일 예쁘게 저장
              excel_path = 'data/안산시장_득표율_현황.xlsx'
              with pd.ExcelWriter(excel_path, engine='openpyxl') as writer:
                  df.to_excel(writer, sheet_name='실시간 현황', index=False)
              print("엑셀 변환 성공!")
              
          except Exception as e:
              print(f"변환 중 에러 발생: {e}")
              df = pd.DataFrame([{"오류 메시지": str(e)}])
              df.to_excel('data/안산시장_득표율_현황.xlsx', index=False)
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/*.xlsx
          git diff --staged --quiet || git commit -m "update election excel data with robust parser"
          git pull --rebase origin main
          git push
