name: Update Election Data

# 경고를 없애기 위해 추가된 새로운 설정입니다.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch election data
        run: |
          mkdir -p data
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://info.nec.go.kr/m/electioninfo/electionInfo_report.json" -o data/data.json

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/data.json
          git diff --staged --quiet || git commit -m "update election data"

      - name: Push
        run: |
          git pull --rebase origin main
          git push
