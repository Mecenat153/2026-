<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안산시장 개표 LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}
.card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}
.name{
    font-size:24px;
    font-weight:bold;
}
.percent{
    font-size:32px;
}
.progress{
    width:100%;
    height:25px;
    background:#eee;
    border-radius:12px;
    overflow:hidden;
}
.bar{
    height:100%;
}
#bar1{background:#4e79ff;}
#bar2{background:#ff5c5c;}
</style>

</head>
<body>

<h1>안산시장 개표 LIVE</h1>

<div class="card">
    <h2>개표율</h2>
    <div id="gaepyo">불러오는 중...</div>
</div>

<div class="card">
    <div class="name" id="name1"></div>
    <div class="percent" id="percent1"></div>
    <div class="progress"><div id="bar1" class="bar"></div></div>
</div>

<div class="card">
    <div class="name" id="name2"></div>
    <div class="percent" id="percent2"></div>
    <div class="progress"><div id="bar2" class="bar"></div></div>
</div>

<div class="card">
    <canvas id="trendChart"></canvas>
</div>

<script>

const labels=[];
const p1=[];
const p2=[];

const chart=new Chart(
document.getElementById('trendChart'),
{
type:'line',
data:{
labels,
datasets:[
{
label:'후보1',
data:p1
},
{
label:'후보2',
data:p2
}
]
}
});

async function loadData(){

const response=await fetch(
'https://info.nec.go.kr/m/electioninfo/electionInfo_report.json'
);

const json=await response.json();

const row=json.jsonResult.body[0];

document.getElementById('name1').innerText=row.HUBO01;
document.getElementById('name2').innerText=row.HUBO02;

document.getElementById('percent1').innerText=row.DUGYUL01+'%';
document.getElementById('percent2').innerText=row.DUGYUL02+'%';

document.getElementById('gaepyo').innerText=
'개표율 '+row.GAEPYOYUL+'%';

document.getElementById('bar1').style.width=
row.DUGYUL01+'%';

document.getElementById('bar2').style.width=
row.DUGYUL02+'%';

const now=new Date().toLocaleTimeString();

labels.push(now);
p1.push(Number(row.DUGYUL01));
p2.push(Number(row.DUGYUL02));

chart.data.datasets[0].label=row.HUBO01;
chart.data.datasets[1].label=row.HUBO02;

chart.update();

}

loadData();

setInterval(loadData,30000);

</script>

</body>
</html>
